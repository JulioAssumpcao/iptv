<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IPTV WEB Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    /* ---- RESET E ESTILOS GLOBAIS ---- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0e14;
      color: #eef2f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    /* ---- HEADER ---- */
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #2a2f3a;
      margin-bottom: 20px;
    }
    header img {
      height: 44px;
      width: auto;
      filter: drop-shadow(0 0 6px rgba(0, 180, 255, 0.3));
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      background: linear-gradient(90deg, #00b4ff, #7b2fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    /* ---- ÁREA DE CARREGAMENTO ---- */
    .load-area {
      width: 100%;
      max-width: 1200px;
      background: #141a24;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border: 1px solid #282f3d;
    }
    .load-area label {
      font-size: 0.95rem;
      font-weight: 500;
      color: #b0c4de;
    }
    .load-area input[type="file"] {
      background: #1e2633;
      color: #ccc;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #3a4455;
      cursor: pointer;
      flex: 1 1 200px;
    }
    .load-area .url-group {
      display: flex;
      flex: 2 1 400px;
      gap: 8px;
    }
    .load-area .url-group input[type="text"] {
      flex: 1;
      background: #1e2633;
      border: 1px solid #3a4455;
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    .load-area .url-group input[type="text"]:focus {
      border-color: #00b4ff;
      box-shadow: 0 0 0 3px rgba(0, 180, 255, 0.15);
    }
    .load-area .btn {
      background: #00b4ff;
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .load-area .btn:hover {
      background: #0099e6;
    }
    .load-area .btn:active {
      transform: scale(0.96);
    }
    .load-area .btn-secondary {
      background: #2a3344;
    }
    .load-area .btn-secondary:hover {
      background: #3a455a;
    }
    /* ---- CONTAINER PRINCIPAL ---- */
    .main-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: row;
      gap: 20px;
      flex: 1;
      min-height: 0;
    }
    .player-container {
      flex: 2;
      background: #0f141e;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      border: 1px solid #2a2f3a;
      aspect-ratio: 16 / 9;
      min-height: 300px;
    }
    .player-container video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    .spinner-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .spinner-overlay.active {
      display: flex;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #2a3344;
      border-top-color: #00b4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* ---- LISTA DE CANAIS ---- */
    .channel-list {
      flex: 1;
      background: #141a24;
      border-radius: 16px;
      padding: 12px 0;
      overflow-y: auto;
      max-height: 70vh;
      border: 1px solid #282f3d;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
    }
    .channel-list::-webkit-scrollbar {
      width: 6px;
    }
    .channel-list::-webkit-scrollbar-thumb {
      background: #2a3344;
      border-radius: 8px;
    }
    .channel-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #channelsContainer {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .channel-item {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s, border-left 0.15s;
      border-left: 3px solid transparent;
      color: #c8d0dc;
      font-size: 0.95rem;
    }
    .channel-item:hover {
      background: #1e2635;
      border-left-color: #00b4ff;
      color: #fff;
    }
    .channel-item.active {
      background: #1a2332;
      border-left-color: #00b4ff;
      color: #fff;
      font-weight: 500;
    }
    .channel-item img {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      object-fit: contain;
      background: #0b0e14;
      flex-shrink: 0;
    }
    .channel-item .channel-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* ---- FOOTER ---- */
    footer {
      margin-top: 24px;
      width: 100%;
      max-width: 1200px;
      text-align: center;
      font-size: 0.85rem;
      color: #5a6a7a;
      border-top: 1px solid #1e2633;
      padding-top: 16px;
    }
    /* ---- RESPONSIVO ---- */
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }
      .player-container {
        aspect-ratio: 16 / 9;
        min-height: 200px;
      }
      .channel-list {
        max-height: 40vh;
      }
      .load-area {
        flex-direction: column;
        align-items: stretch;
      }
      .load-area .url-group {
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 1.2rem;
      }
    }
    /* ---- UTIL ---- */
    .hidden {
      display: none !important;
    }
    .text-muted {
      color: #6a7a8a;
      font-size: 0.85rem;
    }
    .mt-8 { margin-top: 8px; }
    .gap-8 { gap: 8px; }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="IPTV Logo" onerror="this.style.display='none'">
    <h1>IPTV WEB Player</h1>
  </header>

  <!-- Área de carregamento -->
  <div class="load-area">
    <div style="display:flex; flex-wrap:wrap; gap:8px; width:100%;">
      <div style="flex:1; min-width:180px;">
        <label for="m3uFile" style="display:block; margin-bottom:4px;">📁 Upload .m3u</label>
        <input type="file" id="m3uFile" accept=".m3u,.m3u8">
      </div>
      <div class="url-group">
        <div style="flex:1;">
          <label for="playlistUrl" style="display:block; margin-bottom:4px;">🔗 URL da lista</label>
          <input type="text" id="playlistUrl" placeholder="https://.../lista.m3u">
        </div>
        <div style="display:flex; align-items:flex-end; gap:8px;">
          <button class="btn" id="loadUrlBtn">Carregar</button>
          <button class="btn btn-secondary" id="loadDefaultBtn">↺ Padrão</button>
        </div>
      </div>
    </div>
    <div style="width:100%; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
      <span class="text-muted" id="statusMsg">Pronto para carregar.</span>
      <span class="text-muted" id="channelCount"></span>
    </div>
  </div>

  <!-- Player e lista -->
  <div class="main-container">
    <div class="player-container">
      <div class="spinner-overlay" id="spinner">
        <div class="spinner"></div>
      </div>
      <video id="videoPlayer" controls playsinline></video>
    </div>
    <aside class="channel-list" id="channelList">
      <div id="channelsContainer">
        <!-- Canais serão inseridos aqui -->
      </div>
    </aside>
  </div>

  <footer>
    © 2025 IPTV WEB Player | By Bocaletto Luca | Modificado com ❤️ | GPLv3
  </footer>

  <!-- core.js (seu script original) -->
  <script src="core.js"></script>
  <script>
    (function() {
      // ---- Elementos ----
      const fileInput = document.getElementById('m3uFile');
      const urlInput = document.getElementById('playlistUrl');
      const loadUrlBtn = document.getElementById('loadUrlBtn');
      const loadDefaultBtn = document.getElementById('loadDefaultBtn');
      const statusMsg = document.getElementById('statusMsg');
      const channelCount = document.getElementById('channelCount');

      // ---- URL padrão (a sua lista globo.m3u) ----
      const DEFAULT_PLAYLIST = 'globo.m3u';

      // ---- Função para carregar via URL ----
      function loadPlaylistFromURL(url) {
        if (!url) {
          statusMsg.textContent = '⚠️ Insira uma URL válida.';
          return;
        }
        statusMsg.textContent = '⏳ Carregando lista...';
        // Se o player tiver uma função pública para carregar URL, chamamos ela.
        // Caso contrário, simulamos o upload do arquivo.
        if (typeof window.loadPlaylist === 'function') {
          window.loadPlaylist(url);
          statusMsg.textContent = '✅ Lista carregada via URL.';
        } else {
          // Fallback: baixa o arquivo e faz upload programático
          fetch(url)
            .then(res => {
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.text();
            })
            .then(content => {
              const blob = new Blob([content], { type: 'application/x-mpegurl' });
              const file = new File([blob], 'playlist.m3u', { type: 'application/x-mpegurl' });
              // Dispara evento de change no file input
              const dataTransfer = new DataTransfer();
              dataTransfer.items.add(file);
              fileInput.files = dataTransfer.files;
              fileInput.dispatchEvent(new Event('change'));
              statusMsg.textContent = '✅ Lista carregada com sucesso!';
            })
            .catch(err => {
              statusMsg.textContent = `❌ Erro ao carregar: ${err.message}`;
            });
        }
      }

      // ---- Carregar URL padrão automaticamente se houver parâmetro ----
      function autoLoadFromQuery() {
        const params = new URLSearchParams(window.location.search);
        const playlistParam = params.get('playlist');
        if (playlistParam) {
          urlInput.value = playlistParam;
          loadPlaylistFromURL(playlistParam);
          return true;
        }
        return false;
      }

      // ---- Carregar lista padrão (globo.m3u) ----
      function loadDefault() {
        // Se o arquivo globo.m3u estiver no mesmo diretório, podemos carregá-lo.
        // Vamos usar a URL relativa.
        const defaultUrl = window.location.href.split('?')[0].replace(/\/[^/]*$/, '/') + DEFAULT_PLAYLIST;
        urlInput.value = defaultUrl;
        loadPlaylistFromURL(defaultUrl);
      }

      // ---- Eventos ----
      loadUrlBtn.addEventListener('click', function() {
        const url = urlInput.value.trim();
        if (url) {
          loadPlaylistFromURL(url);
        } else {
          statusMsg.textContent = '⚠️ Digite ou cole uma URL.';
        }
      });

      loadDefaultBtn.addEventListener('click', loadDefault);

      // Ao pressionar Enter no campo URL
      urlInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          loadUrlBtn.click();
        }
      });

      // Atualizar contagem de canais (quando o core.js adicionar canais, podemos observar)
      // Vamos usar MutationObserver para contar itens na lista
      const container = document.getElementById('channelsContainer');
      const observer = new MutationObserver(() => {
        const items = container.querySelectorAll('.channel-item');
        channelCount.textContent = items.length ? `📡 ${items.length} canais` : '';
      });
      observer.observe(container, { childList: true, subtree: true });

      // ---- Inicialização ----
      // Tenta carregar via parâmetro na URL, senão carrega o padrão após 1s
      if (!autoLoadFromQuery()) {
        // Se não houver parâmetro, carrega a lista padrão automaticamente
        setTimeout(() => {
          loadDefault();
        }, 800);
      }

      // ---- Expor funções globalmente para o core.js ----
      window.loadPlaylistFromURL = loadPlaylistFromURL;

      console.log('🔧 IPTV WEB Player melhorado carregado.');
    })();
  </script>
</body>
</html>
